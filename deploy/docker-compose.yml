name: nichosi

services:
  nichosi:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      NICHOSI_CONNECTIONS_FILE: /data/config.json
    env_file:
      - path: ../.env
        required: false
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - sqlite-demo:/sqlite
      - ../data:/data
    restart: unless-stopped

volumes:
  sqlite-demo:
