name: nichosi

services:
  nichosi:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      NICHOSI_LOCAL_PREVIEW: "true"
      NICHOSI_CONNECTIONS_FILE: /config/connections.json
    env_file:
      - path: ../.env
        required: false
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - sqlite-demo:/sqlite
      - ../data:/data
      - ../connections.json:/config/connections.json:ro
    restart: unless-stopped

volumes:
  sqlite-demo:
