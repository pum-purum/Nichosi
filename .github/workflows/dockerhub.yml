name: Publish Docker image

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
    steps:
      - name: Validate image and tag
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo '::error::Git tag must be a valid Docker tag (1-128 characters; letters, digits, underscores, periods, and hyphens).'
            exit 1
          fi
          if [[ ! "$IMAGE" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo '::error::Set DOCKERHUB_IMAGE to a lowercase Docker Hub namespace/repository.'
            exit 1
          fi

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: '{{defaultContext}}'
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
