openapi: 3.0.3
info:
  title: Nichosi API
  version: 0.1.0
  description: >
    Contract between the Go backend and the Svelte frontend.
    Change it deliberately and report every change.
servers:
  - url: http://127.0.0.1:8080
security:
  - AdminToken: []
paths:
  /api/health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /api/connections:
    get:
      operationId: listConnections
      security:
        - AdminToken: []
        - {}
      responses:
        "200":
          description: Saved connection profiles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Connection" }
    post:
      operationId: createConnection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        default: { $ref: "#/components/responses/Error" }
  /api/connections/{connId}/schema:
    get:
      operationId: getSchema
      parameters: [ { $ref: "#/components/parameters/ConnId" } ]
      responses:
        "200":
          description: Databases and tables
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schema" }
        default: { $ref: "#/components/responses/Error" }
  /api/connections/{connId}/object-definition:
    get:
      operationId: getObjectDefinition
      description: Fetch the full current CREATE statement for one schema object on demand with a ten-second timeout. Account definitions are provided only through safe schema metadata.
      parameters:
        - { $ref: "#/components/parameters/ConnId" }
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [view, trigger, procedure, function, event] }
        - name: name
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Definition and its availability metadata; unavailable definitions are empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseObject" }
        default: { $ref: "#/components/responses/Error" }
  /api/connections/{connId}/connect:
    post:
      operationId: connectConnection
      parameters: [ { $ref: "#/components/parameters/ConnId" } ]
      responses:
        "200":
          description: Connection is open
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        default: { $ref: "#/components/responses/Error" }
  /api/connections/{connId}/disconnect:
    post:
      operationId: disconnectConnection
      parameters: [ { $ref: "#/components/parameters/ConnId" } ]
      responses:
        "200":
          description: Connection is closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        default: { $ref: "#/components/responses/Error" }
  /api/connections/{connId}/tables/{table}/metadata:
    get:
      operationId: getTableMetadata
      description: Read table metadata on demand with a ten-second timeout and at most 1000 entries per category. Partial metadata includes explicit warnings; row counts and sizes are estimates.
      parameters:
        - { $ref: "#/components/parameters/ConnId" }
        - { $ref: "#/components/parameters/Table" }
      responses:
        "200":
          description: Table metadata, including availability warnings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TableMetadata" }
        default: { $ref: "#/components/responses/Error" }
  /api/connections/{connId}/views/{view}/metadata:
    get:
      operationId: getViewMetadata
      description: Read view properties, columns and the full CREATE VIEW statement on demand, with a ten-second timeout and at most 1000 columns. Uses TableMetadata as a common relation metadata envelope; indexes, foreignKeys and triggers are empty, and storage estimates are omitted because a view has no own table storage. Availability limits are reported as warnings.
      parameters:
        - { $ref: "#/components/parameters/ConnId" }
        - { $ref: "#/components/parameters/View" }
      responses:
        "200":
          description: Read-only view metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TableMetadata" }
        default: { $ref: "#/components/responses/Error" }
  /api/connections/{connId}/views/{view}/rows:
    post:
      operationId: queryViewRows
      description: Read-only view rows with a ten-second timeout, default limit 200 and maximum 1000. Uses RowsQuery limit and offset. Editing is always disabled.
      parameters:
        - { $ref: "#/components/parameters/ConnId" }
        - { $ref: "#/components/parameters/View" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RowsQuery" }
      responses:
        "200":
          description: A page of rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RowsPage" }
        "404":
          description: Connection not found, or view metadata was read successfully and the view does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Database access or metadata query failed. Query failures must not be reported as a missing table.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/connections/{connId}/tables/{table}/rows:
    post:
      operationId: queryRows
      description: Keyset-paginated rows with structured filters (never raw SQL).
      parameters:
        - { $ref: "#/components/parameters/ConnId" }
        - { $ref: "#/components/parameters/Table" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RowsQuery" }
      responses:
        "200":
          description: A page of rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RowsPage" }
        "404":
          description: Connection not found, or table metadata was read successfully and the table does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Database access or metadata query failed. Query failures must not be reported as a missing table.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/connections/{connId}/tables/{table}/changes/preview:
    post:
      operationId: previewChanges
      description: Validates update and delete changes against table metadata. SQL uses placeholders; parameters are returned separately. Only changed columns belong in update values; deletes contain the original row key and no values.
      parameters:
        - { $ref: "#/components/parameters/ConnId" }
        - { $ref: "#/components/parameters/Table" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeSet" }
      responses:
        "200":
          description: Generated SQL, nothing executed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangePreview" }
        default: { $ref: "#/components/responses/Error" }
  /api/connections/{connId}/tables/{table}/changes/apply:
    post:
      operationId: applyChanges
      description: Applies update and delete changes in one transaction with a ten-second timeout; rolls back on any error or when a key does not match exactly one row. Read-only connections and tables without InnoDB storage and a usable primary or unique key are rejected.
      parameters:
        - { $ref: "#/components/parameters/ConnId" }
        - { $ref: "#/components/parameters/Table" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeSet" }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyResult" }
        default: { $ref: "#/components/responses/Error" }
  /api/connections/{connId}/relations:
    get:
      operationId: getRelations
      parameters:
        - { $ref: "#/components/parameters/ConnId" }
        - { name: table, in: query, required: true, schema: { type: string } }
        - { name: depth, in: query, schema: { type: integer, minimum: 1, maximum: 3, default: 1 } }
      responses:
        "200":
          description: Graph around the table
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelationGraph" }
        default: { $ref: "#/components/responses/Error" }
  /api/connections/{connId}/stats/tables:
    get:
      operationId: getTableStats
      parameters: [ { $ref: "#/components/parameters/ConnId" } ]
      responses:
        "200":
          description: Sizes per table
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TableStatsList" }
        default: { $ref: "#/components/responses/Error" }
  /api/connections/{connId}/stats/columns:
    get:
      operationId: getColumnProfile
      parameters:
        - { $ref: "#/components/parameters/ConnId" }
        - { name: table, in: query, required: true, schema: { type: string } }
        - { name: column, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Column profile (sampled)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ColumnProfile" }
        default: { $ref: "#/components/responses/Error" }
components:
  parameters:
    ConnId: { name: connId, in: path, required: true, schema: { type: string } }
    View: { name: view, in: path, required: true, schema: { type: string } }
    Table: { name: table, in: path, required: true, schema: { type: string } }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      required: [status]
      properties: { status: { type: string } }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string, description: "Reported database or driver error text for database failures; displayed directly without a generic replacement" }
    Connection:
      type: object
      required: [id, name, driver, host, port, user, database, readonly, connected, databaseSizeBytes, lastConnectedAt]
      properties:
        id: { type: string }
        name: { type: string }
        driver: { type: string, enum: [mysql, postgres, sqlite] }
        host: { type: string }
        port: { type: integer }
        user: { type: string }
        database: { type: string }
        readonly: { type: boolean, description: "Whether this connection is restricted to read-only operations" }
        connected: { type: boolean, description: "Whether the application currently holds an open database connection" }
        databaseSizeBytes: { type: integer, format: int64, nullable: true, description: "Database size in bytes; null when unavailable" }
        lastConnectedAt: { type: string, format: date-time, nullable: true }
    ConnectionInput:
      type: object
      required: [name, driver, host, port, user, password, database]
      properties:
        name: { type: string }
        driver: { type: string, enum: [mysql, postgres, sqlite] }
        host: { type: string }
        port: { type: integer }
        user: { type: string }
        password: { type: string, writeOnly: true }
        database: { type: string }
        readonly: { type: boolean, default: true, description: "Restrict the connection to read-only operations; defaults to true when omitted" }
    ForeignRef:
      type: object
      required: [table, column]
      properties:
        table: { type: string }
        column: { type: string }
    Column:
      type: object
      required: [name, type, nullable, primaryKey]
      properties:
        name: { type: string }
        type: { type: string }
        nullable: { type: boolean }
        primaryKey: { type: boolean }
        generated:
          type: boolean
          description: Generated columns are displayed but cannot be edited.
        foreignKey:
          allOf: [ { $ref: "#/components/schemas/ForeignRef" } ]
          nullable: true
    TableMetadata:
      type: object
      required: [name, details, columns, indexes, foreignKeys, triggers, definition, warnings]
      properties:
        name: { type: string }
        details:
          type: object
          additionalProperties: { type: string }
        columns:
          type: array
          items: { type: object, additionalProperties: { type: string } }
        indexes:
          type: array
          items: { type: object, additionalProperties: { type: string } }
        foreignKeys:
          type: array
          items: { type: object, additionalProperties: { type: string } }
        triggers:
          type: array
          items: { type: object, additionalProperties: { type: string } }
        definition: { type: string, description: Full server-reported CREATE TABLE statement; empty when unavailable. }
        warnings: { type: array, items: { type: string } }
    TableInfo:
      type: object
      required: [name, rowsEstimate, dataBytes, indexBytes, columns]
      properties:
        name: { type: string }
        rowsEstimate: { type: integer, format: int64 }
        dataBytes: { type: integer, format: int64, description: "Estimated table data size in bytes" }
        indexBytes: { type: integer, format: int64, description: "Estimated table index size in bytes" }
        columns:
          type: array
          items: { $ref: "#/components/schemas/Column" }
    Schema:
      type: object
      required: [tables, objects]
      properties:
        tables:
          type: array
          items: { $ref: "#/components/schemas/TableInfo" }
        objects:
          type: array
          items: { $ref: "#/components/schemas/DatabaseObject" }
        warnings:
          type: array
          items: { type: string }
          description: Metadata categories unavailable due to account permissions.
    DatabaseObject:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [view, trigger, procedure, function, event, role, user] }
        definition:
          type: string
          description: Complete server-reported CREATE statement for schema objects, fetched through getObjectDefinition and omitted from schema listings, when visible to the current account. Empty when unavailable; details explains why. For roles, a reconstructed CREATE ROLE statement only; grants and original creation history are not included. User authentication data is never requested or returned.
        details:
          type: object
          additionalProperties: { type: string }
          description: Read-only object metadata. Accounts are server-wide and include their host. Account category is internal for the known mysql.infoschema/mysql.session/mysql.sys accounts at localhost, default-admin for root at localhost, and other otherwise. This name-based recognition is not creation provenance, a privilege check, or the MySQL SYSTEM_USER category.
    Filter:
      type: object
      required: [column, op]
      properties:
        column: { type: string }
        op: { type: string, enum: [eq, ne, lt, lte, gt, gte, like, in, isNull, notNull] }
        value: {}
    OrderBy:
      type: object
      required: [column]
      properties:
        column: { type: string }
        direction: { type: string, enum: [asc, desc], default: asc }
    RowsQuery:
      type: object
      properties:
        filters:
          type: array
          items: { $ref: "#/components/schemas/Filter" }
        orderBy:
          type: array
          items: { $ref: "#/components/schemas/OrderBy" }
        cursor: { type: string, nullable: true }
        limit: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        offset: { type: integer, minimum: 0, default: 0 }
    RowsPage:
      type: object
      required: [columns, rows, editable, totalRows]
      properties:
        columns:
          type: array
          items: { $ref: "#/components/schemas/Column" }
        rows:
          type: array
          description: Row values in column order. JSON null is SQL NULL.
          items:
            type: array
            items: {}
        nextCursor: { type: string, nullable: true }
        editKey:
          type: array
          description: Ordered columns of a primary or non-null unique key used to identify edited rows. Binary, temporal, prefix, and functional keys are excluded. Empty for read-only sources.
          items: { type: string }
        editable: { type: boolean }
        totalRows: { type: integer, format: int64 }
        readOnlyReason: { type: string, nullable: true }
    Change:
      type: object
      required: [op]
      properties:
        op: { type: string, enum: [insert, update, delete] }
        key:
          type: object
          description: Primary/unique key column to value (update and delete).
          additionalProperties: {}
        values:
          type: object
          description: Column to new value (insert and update). For updates, include only modified columns. Primary key columns cannot be updated.
          additionalProperties: {}
    ChangeSet:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/Change" }
    ChangePreview:
      type: object
      required: [statements, warnings]
      properties:
        statements: { type: array, items: { type: string } }
        parameters:
          type: array
          description: Bound parameter values for each statement, in placeholder order.
          items:
            type: array
            items: {}
        warnings: { type: array, items: { type: string } }
    ApplyResult:
      type: object
      required: [applied, rolledBack]
      properties:
        applied: { type: integer }
        rolledBack: { type: boolean }
    RelationNode:
      type: object
      required: [table, rowsEstimate]
      properties:
        table: { type: string }
        rowsEstimate: { type: integer, format: int64 }
    RelationEdge:
      type: object
      required: [fromTable, fromColumn, toTable, toColumn, kind]
      properties:
        fromTable: { type: string }
        fromColumn: { type: string }
        toTable: { type: string }
        toColumn: { type: string }
        kind: { type: string, enum: [foreignKey, inferred, manual] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        orphanRatio: { type: number, nullable: true, minimum: 0, maximum: 1 }
    RelationGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes: { type: array, items: { $ref: "#/components/schemas/RelationNode" } }
        edges: { type: array, items: { $ref: "#/components/schemas/RelationEdge" } }
    TableStats:
      type: object
      required: [name, dataBytes, indexBytes, rowsEstimate]
      properties:
        name: { type: string }
        dataBytes: { type: integer, format: int64 }
        indexBytes: { type: integer, format: int64 }
        rowsEstimate: { type: integer, format: int64 }
    TableStatsList:
      type: object
      required: [tables]
      properties:
        tables: { type: array, items: { $ref: "#/components/schemas/TableStats" } }
    ColumnProfile:
      type: object
      required: [nullRatio, distinct, top]
      properties:
        nullRatio: { type: number }
        distinct: { type: integer, format: int64 }
        min: {}
        max: {}
        top:
          type: array
          items:
            type: object
            required: [value, count]
            properties:
              value: {}
              count: { type: integer, format: int64 }
        histogram:
          type: array
          items:
            type: object
            required: [bucket, count]
            properties:
              bucket: { type: string }
              count: { type: integer, format: int64 }
  securitySchemes:
    AdminToken:
      type: http
      scheme: bearer
